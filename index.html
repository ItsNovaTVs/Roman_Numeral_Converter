<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roman Numeral Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Roman Numeral Converter</h1>
        <p>Translate your cryptic Roman Numbers into nice Arabic ones you can read! :P</p>
        
        <div class="converter-box">
            <input type="text" id="romanInput" placeholder="Enter Roman numeral..." autocomplete="off">
            <button id="macronBtn" title="Add a macron multiplier (+1000x)">+ Macron</button>
            <button id="convertBtn">Convert</button>
        </div>

        <div id="resultContainer">
            <h2>Result:</h2>
            <p id="outputValue">-</p>
        </div>
    </div>

    <script src="converter.js"></script>
</body>
</html>
